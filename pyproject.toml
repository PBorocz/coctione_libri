[project]
name = "coctione_libri"
version = "0.1.0"
description = ""
authors = [{ name = "Peter Borocz", email = "680893+PBorocz@users.noreply.github.com" }]
requires-python = ">=3.11.0,<4.0"
readme = "README.md"
dependencies = [
    "flask>=3.0.0,<4",
    "flask-htmx>=0.3.2,<0.4",
    "flask-login>=0.6.3,<0.7",
    "pydantic>=2.5.3,<3",
    "python-dotenv>=1.0.0,<2",
    "secure>=0.3.0,<0.4",
    "rich>=13.7.0,<14",
    "wtforms>=3.1.2,<4",
    "flask-wtf>=1.2.1,<2",
    "email-validator>=2.1.0.post1,<3",
    "flask-debugtoolbar>=0.14.1,<0.15",
    "tomli-w>=1.0.0,<2",
    "pandas>=2.2.2,<3",
    "matplotlib>=3.9.0,<4",
    "humanize>=4.11.0,<5",
    "gunicorn>=23.0.0,<24",
    "urllib3>=2.5.0,<3",
    "jinja2>=3.1.6,<4",
    "peewee>=3.18.2",
    "python-box>=7.3.2",
]

[dependency-groups]
dev = [
    "flask-debugtoolbar-mongo>=0.1,<0.2",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.poe.tasks.Deploy]
help = "Deploy to github on behalf of a production release."
shell = """
  jj bookmark set --revision  @- trunk
  jj git push     --revisions @-
  """

[tool.pborocz.deploy.production]
environment_files = [
  ["coctione_libri.env", ".env"],
]
server = "gunicorn"

[tool.pborocz.deploy.testing]
environment_files = [
  ["coctione_libri.env", ".env"],
]
server = "gunicorn"


[tool.ruff]
target-version = "py311"
line-length = 120
lint.ignore = [
  "COM812",  # OBO of ruff format but not sure where this is an issue.
  "D100",    # Ok, I hate the 'Missing docstring in public module' message, sue me!
  "D101",    # Ok, I hate the 'Missing docstring in public class'    "
  "D102",    # Ok, I hate the 'Missing docstring in public method'   "
  "D103",    # Ok, I hate the 'Missing docstring in public function' "
  "D104",    # Ok, I hate the 'Missing docstring in public package'  "
  "D105",    # Ok, I hate the 'Missing docstring in magic method'    "
  "D107",    # Ok, I hate the 'Missing docstring in __init__ method' "
  "D203",    # Get rid of requirement for blank line before class docstring (conflicts with linter)
  "D211",    # Get rid of conflict with D203
  "D213",    # Get rid of conflict with D212 (leaving D212 active.)
  "E402",    # Get rid of message about imports not being at the top (need for flask blueprints)
#  "F401",    # Allows for imports without use (e.g. __init__.py)
  "RUF012",  # Something to do with default values on bunnet class variables not being typed.
]
lint.select = [
  # Which Ruff suites are we running?
  # (presented in order from the Ruff documentation page)
  "F",                          # Pyflakes
  "E", "W",                     # Pycodestyle (Errors and Warnings respectively)
  "C90",                        # Mccabe
  "I",                          # Isort
  "D",                          # Pydocstyle
  "UP",                         # pyupgrade
  "N",                          # pep8-naming
  "YTT",                        # flake8-2020
  # "ANN",                      # flake8-annotations (ie. type annotations!)
  # "S",                        # flake8-bandit
  # "BLE",                      # flake8-blind-except
  # "FBT",                      # flake8-boolean-trap
  "B",                          # flake8-bugbear
  # "A",                        # flake8-builtins (NO! We use "id" as an attribute, sue me...)
  "C4",                         # flake8-comprehensions
  "T10",                        # flake8-debugger
  # "EM",                       # flake8-errmsg
  # "ISC",                      # flake8-implicit-str-concat
  # "ICN",                      # flake8-import-conventions
  # "T20",                      # flake8-print (NO! Removes all print statements!!)
  # "PT",                       # flake8-pytest-style
  "Q",                          # flake8-quotes
  # "RET",                      # flake8-return
  # "SIM",                      # flake8-simplify
  # "TID",                      # flake8-tidy-imports
  # "ARG",                      # flake8-unused-arguments
  # "DTZ",                      # flake8-datetimez
  # "ERA",                      # eradicate
  # "PD",                       # pandas-vet
  # "PGH",                      # pygrep-hooks
  "PLC", "PLE", "PLR", "PLW",   # pylint
  # "PIE",                      # flake8-pie
  "COM",                        # flake8-commas
  "RUF",                        # Ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"config.py" = [
  "N802",  # We want all Config properties to be uppercase (even if from a method)
  "N805",  # We have classmethods defined that use 'cls' as arg, not 'self'!
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.tz.tz",
]

[tool.poe]
verbosity = -1

[tool.poe.tasks.build_css]
cmd = "sass --update app/static/css/sass/styles.scss app/static/css/coctione_libri.css"
help = "Build the coctione_libri.css file from styles.scss"

[tool.poe.tasks.sass_watch]
cmd = "sass --watch  app/static/css/sass/styles.scss app/static/css/coctione_libri.css"
help = "Run sass AUTOMATICALLY when our styles.scss changes."

[tool.poe.tasks.db_quality]
cmd = "uv run python ./app/cli/db_quality.py"
help = "Run data quality script to compare document db with file storage."

[tool.poe.tasks.dbm]
cmd = "dbmate --env SQLITE_DB_MATE --migrations-dir ./app/db/migrations --no-dump-schema"
help = "Run arbitrary dbmate on the local development database"

[tool.poe.tasks.dev_run_local]
interpreter = "fish"
envfile = ".env"
shell = """
  set -x FLASK_ENV "development"
  sass --update app/static/css/sass/styles.scss app/static/css/coctione_libri.css
  uv run flask run --debug --host localhost --port $FLASK_RUN_PORT --cert=../https_local/cert.pem --key=../https_local/key.pem
  """
help = "Run development server against ./data (port 6022)."

[tool.poe.tasks.pytest]
# -v for verbose, test-by-test listing
cmd = "uv run pytest -s -x --pdb"
help = "Run pytest with stdout and pdb on first error."

[tool.poe.tasks.rsync_data_to_production]
shell = """
  sudo rsync --archive --delete --stats ./data/ /Users/service/services/coctione_libri/data/
  sudo chown -R service /Users/service/services/coctione_libri/data/
  """
help = "Run rsync from local .data TO production! (CAREFUL!)"

[tool.poe.tasks.rsync_data_from_production]
shell = """
  sudo rsync --archive --delete --stats /Users/service/services/coctione_libri/data/ ./data/
  """
help = "Run rsync from production to local (safe)"

[tool.poe.tasks.rsync_data_to_testing]
shell = """
  rsync --archive --delete --stats ./data/ "/Users/peter/Repository/10-19 Development/10 Development/10.00 deployment/deployment/testing/coctione_libri/data/"
  """
help = "Run rsync from local .data to deployment testing environment (safe)"

