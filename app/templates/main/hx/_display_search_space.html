<div class="content">
    <br/>
    <div class="is-flex is-flex-wrap-wrap" style="gap: 0.5rem;">
	# for tag, count in tags:
	<style>
	 .tag-style {
	     background-color: #fffafa;
	     border-radius: 4px;
	     cursor: pointer;
	     padding: 3px 3px;
	     font-size: 0.7em;
	     margin: 0px;
	     display: inline-flex;
	     align-items: center;
	     justify-content: center;
	     min-height: 1.5em;  /* ensures consistent height */
	 }
	</style>
	<span class="tag-style"
	      name="tag"
	      hx-post="/search"
	      hx-target="#id_documents_div"
	      hx-vals='{"search": "{{ tag }}"}'
	      style="font-size: {{ 0.6 + (count ** 0.5) * 0.05 }}em;"
	>
	{{ tag.title() }}
	</span>
	# endfor
    </div>
    <br/>
    <div class="is-flex is-flex-wrap-wrap" style="gap: 0.5rem;">
	# for source, count in sources:
	<style>
	 .source-style {
	     background-color: #fffafa;
	     border-radius: 4px;
	     cursor: pointer;
	     padding: 3px 3px;
	     font-size: 0.7em;
	     margin: 0px;
	     display: inline-flex;
	     align-items: center;
	     justify-content: center;
	     min-height: 1.5em;  /* ensures consistent height */
	 }
	</style>
	<span class="source-style"
	      name="source"
	      hx-post="/search"
	      hx-target="#id_documents_div"
	      hx-vals='{"search": "{{ source }}"}'
	      style="font-size: {{ 0.6 + (count ** 0.5) * 0.05 }}em;"
	>
	{{ source }}
	</span>
	# endfor
    </div>
