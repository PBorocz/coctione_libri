<div class="field is-horizontal" id="field_url">
  <div class="field-label is-medium">
    <label class="label">Link</label>
  </div>
  <div class="field-body">
    <div class="control is-flex is-align-items-center">
      <input class="input mr-4 form-input"
	     name="url"
	     value="{{ document.url|default("", true) }}"
	     hx-post="/edit/url/{{ document.public_id_safe }}"
	     hx-swap="outerHTML"
	     hx-target="#field_url"
      >

      # if document.url
	<a href="{{ document.url }}" target="_new">
	  <span class="icon is-small is-right responsive-font">
	    <i class="fa-regular fa-arrow-up-right-from-square"></i>
	  </span>
	</a>
      # endif

      {% include "main/hx/_status_icon.html" %}
    </div>

  </div>
</div>
