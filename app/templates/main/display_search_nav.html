{# --------------------------------------------------------------------------- #}
{# Render the search input control
{# --------------------------------------------------------------------------- #}
<div id="controls" class="field is-grouped is-grouped-multiline">
  <style>
   .no-border {
     border: none !important;
     box-shadow: none !important;
   }
  </style>

  <!-- <div class="control" _="on htmx:afterSettle call document.getElementById('search').focus()"> -->
  <div class="control">
    <p class="control has-icons-left">
      <style>
       .search {
	 border-radius: 6px;
	 border: 1px solid #eee;
	 outline: 0;
	 transition: all .1s ease-in-out;
	 width: 8.0rem;
       }
       /* .search::placeholder { text-align: left; } */
       /* .search:active, .search:focus, .search:not(:placeholder-shown) { width: 12rem; } */
      </style>
      <input
	autofocus
	class="input search responsive-font"
	id="search"
	name="search"
	hx-post="/search"
	hx-target="#id_documents_div"
	placeholder="Search.."
	type="search"
	{% if search %}value="{{ search }}"{% endif %}
      >
      <span class="icon is-small is-left">
	<i class="fas fa-search"></i>
      </span>
    </p>
  </div>

  <!-- Reset, ie. redisplay with search field *cleared* -->
  <div class="control">
    <a href="/reset">
      <button class="button no-border" type="button">
	<span class="icon"><i class="fas fa-house is-size-6"></i></span>
      </button>
    </a>
  </div>

  <!-- Requery -->
  <div class="control">
    <a hx-post="/" hx-target="#id_documents_div" tabindex="0">
      <button class="button no-border" type="button">
	<span class="icon"><i class="fas fa-arrows-rotate is-size-6"></i></span>
      </button>
    </a>
  </div>
</div>
